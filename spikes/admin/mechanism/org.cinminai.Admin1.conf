<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; anyone may call it — polkit decides per request. -->
<busconfig>
  <policy user="root">
    <allow own="org.cinminai.Admin1"/>
    <allow send_destination="org.cinminai.Admin1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cinminai.Admin1" send_interface="org.cinminai.Admin1"/>
    <allow send_destination="org.cinminai.Admin1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.cinminai.Admin1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
